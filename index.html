<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classic Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Classic">
<meta name="theme-color" content="#0D0B07">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { height: 100%; margin: 0; background: #0D0B07; }
  /* Safe-area insets are not exposed inside the portal's iframe, so the
     wrapper keeps the frame clear of the notch and the home indicator and
     the portal's bottom tab bar sits right above the home bar.
     The size has to be spelled out. An iframe does not stretch between
     top/bottom/left/right like a div does: width/height auto falls back to
     the 300x150 iframe default and the portal ends up in a corner. */
  #app {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: env(safe-area-inset-left, 0px);
    width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    border: 0; background: #0D0B07; opacity: 0; transition: opacity .25s ease;
  }
  #app.ready { opacity: 1; }
  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #0D0B07; color: #C9A227;
    font: 600 15px/1.4 -apple-system, system-ui, sans-serif;
    letter-spacing: .28em; text-transform: uppercase;
    transition: opacity .3s ease; z-index: 2;
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash .ring {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid rgba(201,162,39,.25); border-top-color: #C9A227;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #splash .ring { animation: none; } }
  #splash small {
    letter-spacing: .08em; text-transform: none; font-weight: 400;
    color: #8a8271; max-width: 30ch; text-align: center;
  }
  #splash a { color: #C9A227; }
</style>
</head>
<body>
<div id="splash">
  <div class="ring"></div>
  <div>Classic</div>
  <small id="note"></small>
</div>
<iframe id="app" title="Classic Admin Portal" allow="clipboard-write"></iframe>
<noscript><a href="https://script.google.com/macros/s/AKfycbxTsZYovIqSi5EbUZn5HJR4-8nYniVkW5HivKpD4uYEuygLani6k72-UrTdnGbEtJoWLA/exec" style="color:#C9A227">Open the portal</a></noscript>
<script>
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxTsZYovIqSi5EbUZn5HJR4-8nYniVkW5HivKpD4uYEuygLani6k72-UrTdnGbEtJoWLA/exec';
  var app = document.getElementById('app');
  var splash = document.getElementById('splash');
  if (EXEC_URL.indexOf('__') === 0) {
    document.querySelector('#splash .ring').style.display = 'none';
    document.getElementById('note').textContent =
      'Not wired up yet: run deploy-mobile.sh to point this page at the portal.';
  } else {
    app.src = EXEC_URL;
    app.addEventListener('load', function () {
      app.classList.add('ready');
      splash.classList.add('gone');
    });
    // Safety net: never strand the splash if the load event is swallowed.
    setTimeout(function () {
      app.classList.add('ready');
      splash.classList.add('gone');
    }, 8000);
  }
</script>
</body>
</html>
